name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Smoke-test Node SQLite benchmark modes
        shell: bash
        run: |
          node spikes/sqlite-benchmark/node.mjs --mode=sync --iterations=25 --warmup=5 --journal=WAL --synchronous=FULL
          node spikes/sqlite-benchmark/node.mjs --mode=worker --iterations=25 --warmup=5 --journal=WAL --synchronous=FULL
      - run: pnpm run build
