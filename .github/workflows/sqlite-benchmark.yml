name: SQLite runtime benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured transactions per adapter
        required: true
        default: "5000"
      warmup:
        description: Warmup transactions per adapter
        required: true
        default: "500"
      repeats:
        description: Independent repetitions per adapter and OS
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare benchmark result directory
        shell: bash
        run: mkdir -p benchmark-results
      - name: Check Node benchmark syntax
        run: node --check spikes/sqlite-benchmark/node.mjs
      - name: Validate benchmark inputs
        shell: bash
        run: |
          [[ "${{ inputs.iterations }}" =~ ^[1-9][0-9]*$ ]]
          [[ "${{ inputs.warmup }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.repeats }}" =~ ^[1-9][0-9]*$ ]]
          (( ${{ inputs.repeats }} <= 20 ))
      - name: Run repeated Node and Rust benchmarks
        shell: bash
        run: |
          for ((run=1; run<=${{ inputs.repeats }}; run++)); do
            echo "Benchmark repetition $run/${{ inputs.repeats }}"
            node spikes/sqlite-benchmark/node.mjs --mode=sync --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL | tee "benchmark-results/node-sync-${run}.json"
            node spikes/sqlite-benchmark/node.mjs --mode=worker --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL | tee "benchmark-results/node-worker-${run}.json"
            (cd spikes/sqlite-benchmark/rust && cargo run --release --locked -- --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL) | tee "benchmark-results/rust-${run}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-benchmark-${{ matrix.os }}
          path: benchmark-results/*.json
          if-no-files-found: error
