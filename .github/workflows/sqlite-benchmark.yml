name: SQLite runtime benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured transactions per adapter
        required: true
        default: "5000"
      warmup:
        description: Warmup transactions per adapter
        required: true
        default: "500"
      repeats:
        description: Independent repetitions per adapter, sync mode, and OS
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare benchmark result directory
        shell: bash
        run: mkdir -p benchmark-results
      - name: Check Node benchmark syntax
        run: node --check spikes/sqlite-benchmark/node.mjs
      - name: Validate benchmark inputs
        shell: bash
        env:
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_WARMUP: ${{ inputs.warmup }}
          BENCH_REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          [[ "$BENCH_ITERATIONS" =~ ^[1-9][0-9]*$ ]]
          [[ "$BENCH_WARMUP" =~ ^[0-9]+$ ]]
          [[ "$BENCH_REPEATS" =~ ^[1-9][0-9]*$ ]]
          (( BENCH_REPEATS <= 20 ))
      - name: Run repeated Node and Rust benchmarks for FULL and NORMAL
        shell: bash
        env:
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_WARMUP: ${{ inputs.warmup }}
          BENCH_REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          for synchronous in FULL NORMAL; do
            for ((run=1; run<=BENCH_REPEATS; run++)); do
              echo "Benchmark repetition $run/$BENCH_REPEATS ($synchronous)"
              node spikes/sqlite-benchmark/node.mjs --mode=sync --iterations="$BENCH_ITERATIONS" --warmup="$BENCH_WARMUP" --journal=WAL --synchronous="$synchronous" | tee "benchmark-results/node-sync-${synchronous}-${run}.json"
              node spikes/sqlite-benchmark/node.mjs --mode=worker --iterations="$BENCH_ITERATIONS" --warmup="$BENCH_WARMUP" --journal=WAL --synchronous="$synchronous" | tee "benchmark-results/node-worker-${synchronous}-${run}.json"
              (cd spikes/sqlite-benchmark/rust && cargo run --release --locked -- --iterations="$BENCH_ITERATIONS" --warmup="$BENCH_WARMUP" --journal=WAL --synchronous="$synchronous") | tee "benchmark-results/rust-${synchronous}-${run}.json"
            done
          done
      - name: Summarize this OS benchmark results
        shell: bash
        env:
          BENCH_REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          node spikes/sqlite-benchmark/summarize.mjs benchmark-results --expected-repeats="$BENCH_REPEATS" | tee benchmark-results/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-benchmark-${{ matrix.os }}
          path: benchmark-results/
          if-no-files-found: error
