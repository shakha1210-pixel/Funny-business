name: SQLite runtime benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured transactions per adapter
        required: true
        default: "5000"
      warmup:
        description: Warmup transactions per adapter
        required: true
        default: "500"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare benchmark result directory
        shell: bash
        run: mkdir -p benchmark-results
      - name: Check Node benchmark syntax
        run: node --check spikes/sqlite-benchmark/node.mjs
      - name: Run Node built-in SQLite benchmark on main thread
        shell: bash
        run: node spikes/sqlite-benchmark/node.mjs --mode=sync --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL | tee benchmark-results/node-sync.json
      - name: Run Node built-in SQLite benchmark in a worker thread
        shell: bash
        run: node spikes/sqlite-benchmark/node.mjs --mode=worker --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL | tee benchmark-results/node-worker.json
      - name: Run Rust rusqlite benchmark
        shell: bash
        working-directory: spikes/sqlite-benchmark/rust
        run: cargo run --release -- --iterations=${{ inputs.iterations }} --warmup=${{ inputs.warmup }} --journal=WAL --synchronous=FULL | tee ../../../benchmark-results/rust.json
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-benchmark-${{ matrix.os }}
          path: benchmark-results/*.json
          if-no-files-found: error
