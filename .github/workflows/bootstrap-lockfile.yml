name: Bootstrap pnpm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pnpm-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Create review branch
        id: branch
        shell: bash
        run: |
          branch="automation/pnpm-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pnpm-lock.yaml
          git commit -m "build: add pnpm lockfile"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "build: add reproducible pnpm lockfile" \
            --body "Generates and commits pnpm-lock.yaml using pnpm 10.0.0 and Node.js 22. Dependency lifecycle scripts were disabled during lockfile generation. Please review the resolved package graph before merging."
