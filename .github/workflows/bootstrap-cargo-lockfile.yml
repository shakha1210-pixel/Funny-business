name: Bootstrap Rust benchmark lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cargo-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        working-directory: spikes/sqlite-benchmark/rust
        run: cargo generate-lockfile
      - name: Verify locked release build
        working-directory: spikes/sqlite-benchmark/rust
        run: cargo check --release --locked
      - name: Create review branch
        id: branch
        shell: bash
        run: |
          branch="automation/cargo-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add spikes/sqlite-benchmark/rust/Cargo.lock
          git commit -m "build: add Rust benchmark lockfile"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "build: add Rust benchmark Cargo.lock" \
            --body "Generates and verifies the SQLite benchmark dependency lockfile with the current stable Rust toolchain. Review the resolved dependency graph before merging."
