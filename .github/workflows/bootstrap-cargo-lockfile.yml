name: Bootstrap Rust benchmark lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cargo-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin the exact Rust toolchain used for lock generation
        shell: bash
        run: |
          version="$(rustc --version | awk '{print $2}')"
          printf '[toolchain]\\nchannel = "%s"\\nprofile = "minimal"\\n' "$version" > spikes/sqlite-benchmark/rust/rust-toolchain.toml
          cat spikes/sqlite-benchmark/rust/rust-toolchain.toml
      - name: Generate Cargo.lock
        working-directory: spikes/sqlite-benchmark/rust
        run: cargo generate-lockfile
      - name: Verify locked release build
        working-directory: spikes/sqlite-benchmark/rust
        run: cargo check --release --locked
      - name: Create review branch
        id: branch
        shell: bash
        run: |
          branch="automation/cargo-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add spikes/sqlite-benchmark/rust/Cargo.lock spikes/sqlite-benchmark/rust/rust-toolchain.toml
          git commit -m "build: add Rust benchmark lockfile"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "build: pin Rust benchmark toolchain and dependencies" \
            --body "Generates Cargo.lock and pins the exact Rust toolchain used to generate it, then verifies a locked release build. Review the dependency graph and toolchain version before merging."
